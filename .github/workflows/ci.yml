name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements.runtime.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: pip-compile --all-extras --strip-extras --generate-hashes --dry-run --output-file requirements.lock pyproject.toml
      - run: pip-compile --strip-extras --generate-hashes --dry-run --output-file requirements.runtime.lock pyproject.toml
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest
      - run: python -c "from nimbusx.main import app; assert app.title"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  deployment-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/nimbusx-data-plane --set config.heartbeatUrl=https://control.example.invalid/heartbeat --set config.dataPlaneId=ci-plane --set existingSecret=nimbusx-credentials --set image.digest=sha256:ci
      - run: helm template nimbusx-ci deploy/helm/nimbusx-data-plane --set config.heartbeatUrl=https://control.example.invalid/heartbeat --set config.dataPlaneId=ci-plane --set existingSecret=nimbusx-credentials --set image.digest=sha256:ci > /dev/null
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --file docker/data-plane.Dockerfile --tag nimbusx-data-plane:ci .
      - run: docker compose --env-file .env.example up --build --wait
      - run: curl --fail --retry 5 --retry-connrefused http://localhost:8080/healthz
      - run: curl --fail http://localhost:8080/v1/projects
      - if: always()
        run: docker compose --env-file .env.example logs --no-color
      - if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans