[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nimbusx-api"
version = "1.0.0"
description = "Evidence-first climate risk workspace API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.25,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pip-tools>=7.5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
nimbusx-data-plane = "nimbusx.data_plane:main"

[tool.hatch.build.targets.wheel]
packages = ["nimbusx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter cannot safely split source-message literals without altering them.
ignore = ["E501"]
